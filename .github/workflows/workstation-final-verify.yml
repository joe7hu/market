name: workstation-final-verify
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/workstation-final-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.head_ref == 'feat/trader-workstation-completion-20260919' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact reviewed tree and remove temporary workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/workstation-final-verify.yml
          test "$(git write-tree)" = e817bd3f79662b2fcb53200dd2a33334c04f2f43
          python - <<'PY'
          import base64, hashlib, json, lzma, os, urllib.request
          from pathlib import Path
          blobs = ['ed79a81aff6752121e9ea7f5e6484740e399bf01', 'a072b53689b275536885522e1e54bed0e81a5db2', '72334a0c7b034350b7a0a64ee03ee28ff5ee2801', '8e946e28f7054a72c707fa3a30c3ca8280e7509a']
          chunks = []
          for sha in blobs:
              request = urllib.request.Request('https://api.github.com/repos/joe7hu/market/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              chunk = base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == sha
              chunks.append(chunk)
          patch = lzma.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert len(patch) == 97185
          assert hashlib.sha256(patch).hexdigest() == '96b73421c5b9f08ee1c7984f83e03b5c492c22e5571618dab8d8933f2e43e3a6'
          Path('/tmp/workstation-reviewed.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/workstation-reviewed.patch
          git apply --index /tmp/workstation-reviewed.patch
          git diff --cached --check
          test "$(git write-tree)" = 53b494aacde78842cbf31ef825c3d90e42fddda4
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Complete workstation review fixes and add read-only local verification handoff'
          git push origin HEAD:refs/heads/feat/trader-workstation-completion-20260919
          printf 'Verified commit: '; git rev-parse HEAD
          printf 'Verified tree: '; git rev-parse HEAD^{tree}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - name: Install locked dependencies
        run: |
          uv sync --extra test --locked
          npm ci --prefix frontend
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - name: Bootstrap isolated CI application role
        env:
          MARKET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          ci_password="$(openssl rand -hex 32)"
          PGPASSWORD=postgres psql "$MARKET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE market_ci_login LOGIN PASSWORD '$ci_password' NOSUPERUSER NOBYPASSRLS NOINHERIT NOCREATEROLE NOCREATEDB NOREPLICATION"
          export MARKET_APP_LOGIN_ROLE=market_ci_login
          export MARKET_APP_DATABASE_PASSWORD="$ci_password"
          uv run market-db-migrate
      - name: Focused completion and PostgreSQL regressions
        run: |
          uv run --extra test python -m pytest \
            tests/test_market_observation_lineage.py tests/test_market_scope_isolation.py \
            tests/test_quote_clock_evidence.py tests/test_strategy_parameter_preflight.py \
            tests/test_workstation_readiness.py tests/test_targeted_paper_quotes.py \
            tests/test_paper_management_fairness.py tests/test_paper_tick_ordering.py \
            tests/test_paper_execution_scheduling.py tests/test_paper_quote_numeric_safety.py \
            tests/options/decision_truth/test_option_trade_ticket.py tests/test_strategy_parameters.py \
            tests/test_workstation_verification.py tests/postgres/test_workstation_completion.py -q
      - name: Full release gate
        if: ${{ !cancelled() }}
        run: make release-gate
      - name: Final tracked-tree check
        if: ${{ !cancelled() }}
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"
