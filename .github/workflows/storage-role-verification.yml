name: storage-role-verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'feat/bounded-hot-storage' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - name: Apply verified role-boundary correction and remove temporary workflow
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          packed = base64.b64decode('')
          assert hashlib.sha256(packed).hexdigest() == '4dbe72d9310e02b7a26cdb51787e63cd8406e0df7dbefc0954f57fcbf8f8323d'
          for change in json.loads(gzip.decompress(packed)):
              path = Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('src', 'migrations', 'tests', 'docs')
              old = path.read_text()
              digest = hashlib.sha256(old.encode()).hexdigest()
              if digest == change['after']: continue
              assert digest == change['before'], str(path)
              lines = old.splitlines(keepends=True)
              for edit in reversed(change['edits']): lines[edit['start']:edit['end']] = [edit['text']]
              new = ''.join(lines)
              assert hashlib.sha256(new.encode()).hexdigest() == change['after'], str(path)
              path.write_text(new)
          PY
          git rm --ignore-unmatch .github/workflows/storage-role-verification.yml
          git add src migrations tests docs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='ChatGPT' -c user.email='noreply@openai.com' commit -m 'Exercise retention with the application role and constrain metadata deletion'
            git push origin HEAD:refs/heads/feat/bounded-hot-storage
          fi
          git rev-parse HEAD | tee verified-commit.txt
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - run: uv sync --extra test --locked
      - name: Non-owner lifecycle and privilege regressions
        run: |
          set -o pipefail
          uv run --extra test python -m pytest tests/postgres/test_hot_storage_lifecycle.py tests/postgres/test_option_paper_writer_privileges.py -q --junitxml=role-results.xml 2>&1 | tee role-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-role-verification
          path: |
            role-results.xml
            role-tests.log
            verified-commit.txt
          retention-days: 7
      - name: Storage compatibility and architecture regressions
        run: |
          set -o pipefail
          uv run --extra test python -m pytest tests/postgres/test_decision_storage.py tests/postgres/test_postgres_retention_backup.py tests/postgres/test_schema_baseline.py tests/postgres/test_storage_archive.py tests/options/history/test_option_history.py tests/contracts/test_architecture_guards.py tests/contracts/test_postgres_runtime_boundary.py -q --junitxml=compatibility-results.xml 2>&1 | tee compatibility-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-role-compatibility
          path: |
            compatibility-results.xml
            compatibility-tests.log
            verified-commit.txt
          retention-days: 7
