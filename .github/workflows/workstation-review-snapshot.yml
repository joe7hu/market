name: workstation-review-snapshot
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/workstation-review-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'feat/trader-workstation-completion-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar --output=source.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workstation-source
          path: source.tar
          retention-days: 1
          if-no-files-found: error
