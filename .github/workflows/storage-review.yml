name: storage-review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  release-verification:
    if: github.head_ref == 'feat/bounded-hot-storage' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl --junitxml=release-results.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - name: Finalize fixture and remove temporary review transport
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/postgres/test_hot_storage_lifecycle.py')
          old = "INSERT INTO analysis.run (run_type, input_cutoff, code_version, input_hash)\n            VALUES ('storage-test', %s, 'test', %s)"
          new = "INSERT INTO analysis.run (run_type, input_cutoff, code_version, input_hash, started_at, status)\n            VALUES ('storage-test', %s, 'test', %s, now(), 'succeeded')"
          text = p.read_text()
          assert old in text or new in text
          p.write_text(text.replace(old, new))
          PY
          git rm --ignore-unmatch .github/storage-change-1.b64 .github/storage-change-2.b64 .github/storage-change-3.b64 .github/storage-change-4.b64 .github/workflows/storage-review.yml
          git add tests/postgres/test_hot_storage_lifecycle.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='ChatGPT' -c user.email='noreply@openai.com' commit -m 'Fix lifecycle fixture and remove temporary verification transport'
            git push origin HEAD:refs/heads/feat/bounded-hot-storage
          fi
          git rev-parse HEAD | tee verified-commit.txt
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - name: Install dependencies
        run: |
          uv sync --extra test --locked
          npm ci --prefix frontend
      - name: Bootstrap and migrate isolated CI PostgreSQL
        env:
          MARKET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          ci_password="$(openssl rand -hex 32)"
          PGPASSWORD=postgres psql "$MARKET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE market_ci_login LOGIN PASSWORD '$ci_password' NOSUPERUSER NOBYPASSRLS NOINHERIT NOCREATEROLE NOCREATEDB NOREPLICATION"
          export MARKET_APP_LOGIN_ROLE=market_ci_login
          export MARKET_APP_DATABASE_PASSWORD="$ci_password"
          uv run market-db-migrate
      - name: Complete release gate
        run: |
          set -o pipefail
          make release-gate 2>&1 | tee release-gate.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-release-verification
          path: |
            verified-commit.txt
            release-results.xml
            release-gate.log
          retention-days: 7
