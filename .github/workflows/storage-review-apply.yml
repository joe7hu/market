name: storage-review-apply
on:
  pull_request:
    paths:
      - .github/workflows/storage-review-apply.yml
      - .storage-review/**
permissions:
  contents: write
jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'storage/nas-archive-and-compact-decisions'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply reviewed safety patch to this branch only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          xz -d -c .storage-review/followup.patch.xz > /tmp/storage.patch
          echo '57785a69e11bc8c2c08d7006e496cbb14fe642792c9d0986ede2c8b7fada3b3e  /tmp/storage.patch' | sha256sum -c
          git apply --index /tmp/storage.patch
          git config user.name 'Market storage maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bound storage maintenance and preserve exact archive values'
          git fetch origin storage/nas-archive-and-compact-decisions
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/storage/nas-archive-and-compact-decisions
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - run: uv sync --extra test --locked
      - name: Bootstrap and migrate isolated PostgreSQL
        env:
          MARKET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          ci_password="$(openssl rand -hex 32)"
          PGPASSWORD=postgres psql "$MARKET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE market_ci_login LOGIN PASSWORD '$ci_password' NOSUPERUSER NOBYPASSRLS NOINHERIT NOCREATEROLE NOCREATEDB NOREPLICATION"
          export MARKET_APP_LOGIN_ROLE=market_ci_login
          export MARKET_APP_DATABASE_PASSWORD="$ci_password"
          uv run market-db-migrate
      - name: Focused storage and trading regression tests
        run: uv run pytest tests/postgres/test_decision_storage.py tests/postgres/test_storage_safety_limits.py tests/postgres/test_storage_archive.py tests/postgres/test_postgres_retention_backup.py tests/postgres/test_ticker_paper_execution.py -q --tb=short
      - run: npm ci --prefix frontend
      - name: Full release gate
        run: make release-gate
