name: workstation-completion-verify
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/workstation-completion-verify.yml']
permissions:
  contents: write
jobs:
  implement-and-check:
    if: github.head_ref == 'feat/trader-workstation-completion-20260919' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - name: Install locked dependencies
        run: |
          uv sync --extra test --locked
          npm ci --prefix frontend
      - name: Apply exact reviewed file contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          base = 'fcea831006d77907477ff06bce91cfb0d0505c79'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          workflow = '.github/workflows/workstation-completion-verify.yml'
          if changed != [workflow]:
              raise SystemExit('Branch changed outside the expected transfer workflow; reconcile first')
          shas = ['aba77e61e60cb9fe62ba599c0bc9832b76adfb4f', 'd64d621143e9175d59290ec0b2bd411746828a00', '673a935780da0a6e17dae3fcc1342e5a93f3a899', '858434ec329bb59f77280456a5947791e431d84f']
          parts = []
          for sha in shas:
              blob = json.loads(subprocess.check_output(['gh', 'api', f'repos/joe7hu/market/git/blobs/{sha}']))
              text = base64.b64decode(blob['content'])
              actual = hashlib.sha1(b'blob ' + str(len(text)).encode() + b'\0' + text).hexdigest()
              if actual != sha:
                  raise SystemExit('Transfer blob integrity failure')
              parts.append(text)
          raw = lzma.decompress(base64.b64decode(b''.join(parts)))
          if hashlib.sha256(raw).hexdigest() != '0cff1d2fc63d16b77023a8e0d37fba0f3910ba97e3fff335945868885ceacea2':
              raise SystemExit('Implementation payload integrity failure')
          payload = json.loads(raw)
          if payload['base'] != base:
              raise SystemExit('Unexpected implementation base')
          def oid(content):
              return hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          writes = []
          seen = set()
          for item in payload['files']:
              path = pathlib.PurePosixPath(item['path'])
              if path.is_absolute() or '..' in path.parts or str(path) in seen or not str(path).startswith(('src/', 'frontend/src/', 'tests/', 'docs/', 'migrations/versions/')):
                  raise SystemExit('Unexpected implementation path')
              seen.add(str(path))
              local = pathlib.Path(path)
              prior = local.read_bytes() if local.exists() else None
              if (oid(prior) if prior is not None else None) != item['before']:
                  raise SystemExit(f'Original file changed: {path}')
              if 'content' in item:
                  after = item['content'].encode()
              else:
                  lines = prior.decode().splitlines(keepends=True)
                  chunks, cursor = [], 0
                  for start, end, text in item['edits']:
                      if not cursor <= start <= end <= len(lines):
                          raise SystemExit('Invalid replacement range')
                      chunks.extend(lines[cursor:start]); chunks.append(text); cursor = end
                  chunks.extend(lines[cursor:])
                  after = ''.join(chunks).encode()
              if oid(after) != item['after']:
                  raise SystemExit(f'Reviewed output integrity failure: {path}')
              writes.append((local, after))
          for local, content in writes:
              local.parent.mkdir(parents=True, exist_ok=True)
              local.write_bytes(content)
          pathlib.Path(workflow).unlink()
          pathlib.Path('/tmp/workstation-paths.json').write_text(json.dumps([str(p) for p, _ in writes] + payload['generated'] + [workflow]))
          print(f'Applied {len(writes)} hash-verified files')
          PY
          npm --prefix frontend run generate:api
          git diff --check
          python - <<'PY'
          import json, subprocess
          paths = json.load(open('/tmp/workstation-paths.json'))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Complete workstation readiness, prospective paper lifecycle, trader views and learning diagnostics'
          git push origin HEAD:refs/heads/feat/trader-workstation-completion-20260919
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - name: Bootstrap migration authority
        env:
          MARKET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          ci_password="$(openssl rand -hex 32)"
          PGPASSWORD=postgres psql "$MARKET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE market_ci_login LOGIN PASSWORD '$ci_password' NOSUPERUSER NOBYPASSRLS NOINHERIT NOCREATEROLE NOCREATEDB NOREPLICATION"
          export MARKET_APP_LOGIN_ROLE=market_ci_login
          export MARKET_APP_DATABASE_PASSWORD="$ci_password"
          uv run market-db-migrate
      - name: Focused backend and PostgreSQL verification
        run: |
          uv run --extra test python -m pytest \
            tests/test_market_observation_lineage.py tests/test_market_scope_isolation.py \
            tests/test_quote_clock_evidence.py tests/test_strategy_parameter_preflight.py \
            tests/test_workstation_readiness.py tests/test_targeted_paper_quotes.py \
            tests/test_paper_management_fairness.py tests/test_paper_tick_ordering.py \
            tests/test_paper_execution_scheduling.py tests/test_paper_quote_numeric_safety.py \
            tests/test_option_trade_ticket.py tests/test_strategy_parameters.py \
            tests/postgres/test_workstation_completion.py -q
      - name: Full static and frontend gate
        if: ${{ !cancelled() }}
        run: make check build
      - name: Existing affected integration suites
        if: ${{ !cancelled() }}
        run: |
          uv run --extra test python -m pytest \
            tests/options/paper_execution tests/postgres/test_postgres_market_analysis.py \
            tests/test_market_valuation_refresh.py tests/test_paper_workbench.py \
            tests/test_scheduler.py tests/application_api -q
