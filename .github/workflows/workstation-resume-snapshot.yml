name: workstation-resume-snapshot
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/workstation-resume-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feat/trader-workstation-completion-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Export tracked source and tool runtime only
        run: |
          git archive --format=tar --output=source.tar HEAD
          tar -czf python-runtime.tar.gz -C "$pythonLocation" bin lib include share
          git rev-parse HEAD > source-commit.txt
          git rev-parse HEAD^{tree} > source-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workstation-resume-source
          path: |
            source.tar
            python-runtime.tar.gz
            source-commit.txt
            source-tree.txt
          retention-days: 1
          if-no-files-found: error
