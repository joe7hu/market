name: decision-loop-workspace-publish
on:
  pull_request:
    paths: [.github/workflows/review-publish.yml]
permissions:
  contents: write
  statuses: write
jobs:
  publish-and-verify:
    if: github.repository == 'joe7hu/market' && github.event.pull_request.number == 38 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/decision-loop-paper-traceability'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply hash-verified release closure
        id: edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/joe7hu/market/git/blobs/9795575b2d7ce95cb98d99f96d07f88d7af789e8 --jq .content | base64 --decode > /tmp/market-closure-edits.json
          test "$(git hash-object /tmp/market-closure-edits.json)" = 9795575b2d7ce95cb98d99f96d07f88d7af789e8
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          pending = {}
          for item in json.loads(Path('/tmp/market-closure-edits.json').read_text()):
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'src', 'tests', 'migrations', 'docs'}
              assert str(path) not in pending
              before = path.read_bytes() if path.exists() else b''
              digest = hashlib.sha256(before).hexdigest() if path.exists() else None
              if digest == item['after']:
                  continue
              assert digest == item['before'], str(path)
              lines = before.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  assert 0 <= start <= end <= len(before.decode().splitlines(keepends=True))
                  lines[start:end] = [replacement]
              output = ''.join(lines).encode()
              assert hashlib.sha256(output).hexdigest() == item['after'], str(path)
              pending[str(path)] = output
          for name, output in pending.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(output)
          Path('/tmp/market-closure-paths.json').write_text(json.dumps(list(pending)))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'changed={str(bool(pending)).lower()}\n')
          print(f'Applied {len(pending)} hash-verified source, test and documentation changes.')
          PY
      - name: Publish closure to the authorized PR branch only
        if: steps.edits.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json, subprocess
          subprocess.run(['git', 'add', '--', *json.load(open('/tmp/market-closure-paths.json'))], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close decision-loop regressions and bound experiment read latency'
          git push origin HEAD:refs/heads/fix/decision-loop-paper-traceability
      - name: Select exact final head after temporary workflow removal
        id: source
        if: steps.edits.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleaned=false
          for attempt in $(seq 1 48); do
            git fetch --quiet origin fix/decision-loop-paper-traceability
            git diff --exit-code HEAD FETCH_HEAD -- . ':!.github/workflows/review-snapshot.yml' ':!.github/workflows/review-publish.yml'
            if ! git cat-file -e FETCH_HEAD:.github/workflows/review-snapshot.yml 2>/dev/null && ! git cat-file -e FETCH_HEAD:.github/workflows/review-publish.yml 2>/dev/null; then
              cleaned=true
              break
            fi
            sleep 10
          done
          test "$cleaned" = true
          git checkout --detach FETCH_HEAD
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha" > /tmp/market-tested-commit.txt
          gh api "repos/joe7hu/market/statuses/$sha" -f state=pending -f context=decision-loop/release-gate -f description='Full unchanged release gate on cleaned PR head' -f target_url="https://github.com/joe7hu/market/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        if: steps.edits.outputs.changed == 'true'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: steps.edits.outputs.changed == 'true'
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: steps.edits.outputs.changed == 'true'
        with:
          version: '0.9.26'
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        if: steps.edits.outputs.changed == 'true'
        with:
          postgres-version: '18'
      - name: Full unchanged release gate
        id: verify
        if: steps.edits.outputs.changed == 'true'
        run: |
          set -euo pipefail
          uv sync --extra test --locked
          npm ci --prefix frontend
          make release-gate 2>&1 | tee /tmp/market-closure-release.log
      - name: Record result on the tested commit
        if: always() && steps.source.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.source.outputs.sha }}
          RESULT: ${{ steps.verify.outcome }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api "repos/joe7hu/market/statuses/$TESTED_SHA" -f state="$state" -f context=decision-loop/release-gate -f description="Full unchanged release gate: $RESULT" -f target_url="https://github.com/joe7hu/market/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.edits.outputs.changed == 'true'
        with:
          name: decision-loop-closure-release
          path: |
            /tmp/market-closure-release.log
            /tmp/market-tested-commit.txt
          retention-days: 7
