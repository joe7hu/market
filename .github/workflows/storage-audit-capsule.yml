name: storage-audit-capsule

on:
  pull_request:
    paths:
      - .github/workflows/storage-audit-capsule.yml

permissions:
  contents: read

jobs:
  source-capsule:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/market-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: market-source-audit
          path: ${{ runner.temp }}/market-source.tar.gz
          retention-days: 1
          if-no-files-found: error
