name: workstation-regression-verify
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/workstation-regression-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.head_ref == 'feat/trader-workstation-completion-20260919' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply the reviewed lint fix and remove this temporary workflow
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('src/investment_panel/infrastructure/postgres/strategy_learning.py')
          before = p.read_bytes()
          def oid(x):
              return hashlib.sha1(b'blob ' + str(len(x)).encode() + b'\0' + x).hexdigest()
          assert oid(before) == 'cbf689ac1a791fc121f8674c8d2b37e6a0873ad3', 'Reconcile changed source before applying'
          after = before.replace(b'    merge_strategy_parameters,\n', b'')
          assert oid(after) == 'dc63ae727c58e94983f99beccd345297e6c79cdc', 'Unexpected replacement'
          p.write_bytes(after)
          Path('.github/workflows/workstation-regression-verify.yml').unlink()
          PY
          git diff --check
          git add src/investment_panel/infrastructure/postgres/strategy_learning.py .github/workflows/workstation-regression-verify.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove stale strategy import and temporary verification workflow'
          git push origin HEAD:refs/heads/feat/trader-workstation-completion-20260919
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - name: Install locked dependencies
        run: |
          uv sync --extra test --locked
          npm ci --prefix frontend
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - name: Focused backend and PostgreSQL contracts
        run: |
          uv run --extra test python -m pytest \
            tests/test_market_observation_lineage.py tests/test_market_scope_isolation.py \
            tests/test_quote_clock_evidence.py tests/test_strategy_parameter_preflight.py \
            tests/test_workstation_readiness.py tests/test_targeted_paper_quotes.py \
            tests/test_paper_management_fairness.py tests/test_paper_tick_ordering.py \
            tests/test_paper_execution_scheduling.py tests/test_paper_quote_numeric_safety.py \
            tests/options/decision_truth/test_option_trade_ticket.py tests/test_strategy_parameters.py \
            tests/postgres/test_workstation_completion.py -q
      - name: Static and frontend gate
        if: ${{ !cancelled() }}
        run: make check build
