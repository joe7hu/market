name: workstation-regression-verify
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/workstation-regression-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'feat/trader-workstation-completion-20260919' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        suite: [focused, checks]
    name: workstation-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - name: Install locked dependencies
        run: |
          uv sync --extra test --locked
          npm ci --prefix frontend
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - name: Focused backend and PostgreSQL contracts
        if: matrix.suite == 'focused'
        run: |
          uv run --extra test python -m pytest \
            tests/test_market_observation_lineage.py tests/test_market_scope_isolation.py \
            tests/test_quote_clock_evidence.py tests/test_strategy_parameter_preflight.py \
            tests/test_workstation_readiness.py tests/test_targeted_paper_quotes.py \
            tests/test_paper_management_fairness.py tests/test_paper_tick_ordering.py \
            tests/test_paper_execution_scheduling.py tests/test_paper_quote_numeric_safety.py \
            tests/options/decision_truth/test_option_trade_ticket.py tests/test_strategy_parameters.py \
            tests/postgres/test_workstation_completion.py -q
      - name: Static and frontend gate
        if: matrix.suite == 'checks'
        run: make check build
