name: storage-final-verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: github.head_ref == 'feat/bounded-hot-storage' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove temporary verifier and pin tested revision
        run: |
          set -euo pipefail
          git rm .github/workflows/storage-final-verification.yml
          git -c user.name='ChatGPT' -c user.email='noreply@openai.com' commit -m 'Remove temporary final storage verifier'
          git push origin HEAD:refs/heads/feat/bounded-hot-storage
          git rev-parse HEAD | tee verified-commit.txt
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - run: uv sync --extra test --locked
      - name: Bootstrap and migrate PostgreSQL
        env:
          MARKET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          ci_password="$(openssl rand -hex 32)"
          PGPASSWORD=postgres psql "$MARKET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE market_ci_login LOGIN PASSWORD '$ci_password' NOSUPERUSER NOBYPASSRLS NOINHERIT NOCREATEROLE NOCREATEDB NOREPLICATION"
          export MARKET_APP_LOGIN_ROLE=market_ci_login
          export MARKET_APP_DATABASE_PASSWORD="$ci_password"
          uv run market-db-migrate
      - run: npm ci --prefix frontend
      - name: Full release gate
        run: |
          set -o pipefail
          make release-gate 2>&1 | tee release-gate.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-final-verification
          path: |
            release-gate.log
            verified-commit.txt
          retention-days: 7
