name: market-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-ci:
    name: market-ci
    runs-on: ubuntu-24.04
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.26"

      - name: Set up PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          postgres-version: "18"

      - name: Install Python dependencies
        run: uv sync --extra test --locked

      - name: Bootstrap and migrate CI PostgreSQL
        # CI has no deployment-provided application login. Create one with
        # an ephemeral password, then let the role-boundary migrations verify
        # its attributes, membership, protected-role reachability, and ACLs.
        env:
          MARKET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          ci_password="$(openssl rand -hex 32)"
          PGPASSWORD=postgres psql "$MARKET_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE market_ci_login LOGIN PASSWORD '$ci_password' NOSUPERUSER NOBYPASSRLS NOINHERIT NOCREATEROLE NOCREATEDB NOREPLICATION"
          export MARKET_APP_LOGIN_ROLE=market_ci_login
          export MARKET_APP_DATABASE_PASSWORD="$ci_password"
          uv run market-db-migrate

      - name: Install Node dependencies
        run: npm ci

      - name: Run Phase 0 gate
        run: make phase0-gate
