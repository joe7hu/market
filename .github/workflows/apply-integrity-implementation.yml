name: Apply verified decision integrity implementation
on:
  push:
    branches: [fix/decision-service-integrity]
    paths: [.github/workflows/apply-integrity-implementation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 16
      - name: Verify and apply exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/decision-service-integrity
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          base = 'cdc4034e8baa62463490caaefa3c73c00b8190bf'
          chunks = [f'.github/integrity-patch-{i}.txt' for i in range(1, 5)]
          workflow = '.github/workflows/apply-integrity-implementation.yml'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          assert changed <= set(chunks + [workflow]), sorted(changed)
          encoded = ''.join(Path(p).read_text() for p in chunks)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '59ea46313708c615418f04772cfaa4eeea74f2afb32ec18269e8211c0405485e'
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '-'], input=patch, check=True)
          repairs = '''diff --git a/tests/application_api/test_api.py b/tests/application_api/test_api.py
          index 91b581e..df32ff0 100644
          --- a/tests/application_api/test_api.py
          +++ b/tests/application_api/test_api.py
          @@ -2109 +2109 @@ def test_ticker_decision_brief_uses_specific_source_gap_language() -> None:
          -def test_frontend_fallback_serves_spa_deep_links_after_build() -> None:
          +def test_frontend_fallback_serves_spa_deep_links_after_build(monkeypatch: pytest.MonkeyPatch) -> None:
          @@ -2114 +2114,4 @@ def test_frontend_fallback_serves_spa_deep_links_after_build() -> None:
          -    client = TestClient(app)
          +    # Build output may be created after module-level app import (for example
          +    # alongside contract generation). Exercise a newly mounted deployment.
          +    monkeypatch.setenv("MARKET_FRONTEND_DIST", str(dist_index.parent))
          +    client = TestClient(app_main.create_app())
          @@ -2137 +2140 @@ def test_frontend_fallback_serves_spa_deep_links_after_build() -> None:
          -        assert response.status_code == 200
          +        assert response.status_code == 200, path
          diff --git a/tests/postgres/test_postgres_continuous_advisor.py b/tests/postgres/test_postgres_continuous_advisor.py
          index e7e0aa7..5302be4 100644
          --- a/tests/postgres/test_postgres_continuous_advisor.py
          +++ b/tests/postgres/test_postgres_continuous_advisor.py
          @@ -26 +26 @@ def _packet(
          -            "portfolio": {"price": 100, "quote_observed_at": cutoff, "owned": True},
          +            "portfolio": {"price": 100, "quote_observed_at": cutoff, "quote_available_at": cutoff, "owned": True},
          '''.encode()
          assert hashlib.sha256(repairs).hexdigest() == '783fcf7a2c65714a6cd48a384b9b064b47772ca72ac574c5a41115f07a5a4e19'
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '-'], input=repairs, check=True)
          subprocess.run(['git', 'rm', '--', *chunks, workflow], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '45054df11ae79044f0a9ab89fe40ec036d507fff', tree
          print('Verified complete workspace tree:', tree)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: deliver complete signal pipeline, honest health, causal learning and regression coverage'
          git push origin HEAD:refs/heads/fix/decision-service-integrity
