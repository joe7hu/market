name: review-source-snapshot
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'joe7hu/market' && github.event.pull_request.number == 38
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > /tmp/market-final-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-final-source
          path: /tmp/market-final-source.tar
          retention-days: 1
