name: review-source-snapshot

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/review-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Extract PostgreSQL 18 verification runtime
        run: |
          mkdir -p /tmp/review-postgres
          docker run --rm --entrypoint bash -v /tmp/review-postgres:/out postgres:18-trixie -ec '
            mkdir -p /out/postgresql /out/pg-libs /out/pg-share
            cp -a /usr/lib/postgresql/18 /out/postgresql/
            cp -a /usr/share/postgresql/18 /out/pg-share/
            for f in /usr/lib/postgresql/18/bin/{postgres,initdb,pg_ctl,psql}; do
              ldd "$f" | awk "/=> \\// {print \$3}" | xargs -r -I{} cp -L {} /out/pg-libs/
            done
          '
          tar -C /tmp/review-postgres -czf /tmp/review-postgres18.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-review-postgres18
          path: /tmp/review-postgres18.tar.gz
          retention-days: 1
          compression-level: 0
