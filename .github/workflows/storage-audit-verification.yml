name: storage-audit-verification
on:
  push:
    branches: [codex/storage-audit-20260927]
    paths: [.github/workflows/storage-audit-verification.yml]
permissions:
  contents: write
jobs:
  storage-audit:
    if: github.ref == 'refs/heads/codex/storage-audit-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed correction and freeze final source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/investment_panel/infrastructure/postgres/ingestion.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '03ce1512ff27e485da89f3fd53742cfc32a7e8da1b2cdcbb4f4dd39a2fb72bad'
          old = '''                    WHERE (raw.fundamental_observation.ingest_run_id,
                                     raw.fundamental_observation.filed_at,
                                     raw.fundamental_observation.values) IS DISTINCT FROM
                                    (EXCLUDED.ingest_run_id, EXCLUDED.filed_at, EXCLUDED.values)'''
          # Match the source exactly rather than tolerating an unexpected edit.
          old = '\n'.join([
              '                    WHERE (raw.fundamental_observation.ingest_run_id,',
              '                           raw.fundamental_observation.filed_at,',
              '                           raw.fundamental_observation.values) IS DISTINCT FROM',
              '                          (EXCLUDED.ingest_run_id, EXCLUDED.filed_at, EXCLUDED.values)',
          ])
          new = '\n'.join([
              '                    WHERE (raw.fundamental_observation.filed_at,',
              '                           raw.fundamental_observation.values) IS DISTINCT FROM',
              '                          (EXCLUDED.filed_at, EXCLUDED.values)',
              '                       OR (raw.fundamental_observation.ingest_run_id IS DISTINCT FROM',
              '                           EXCLUDED.ingest_run_id AND NOT EXISTS (',
              '                             SELECT 1 FROM ingest.run previous_run',
              '                             WHERE previous_run.id = raw.fundamental_observation.ingest_run_id',
              "                               AND previous_run.status IN ('succeeded', 'partial')",
              '                               AND previous_run.finished_at IS NOT NULL',
              '                           ))',
          ])
          s = p.read_text()
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)
          compile(s, str(p), 'exec')
          p = Path('docs/acceptance/storage-schema-audit-20260927.md')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'b117383e850abb1c90b5c96caca98a5538387a3919465e80eb063a71c1be4440'
          s = p.read_text().replace('An independent external review is not claimed.', 'Independent Codex review results and any correction verification are recorded in the PR discussion.')
          s = s.replace('### Index changes and deliberate non-changes', '''### Independent-review correction: cross-run fundamentals
          
          The first no-op guard compared ingestion run IDs, so an identical observation
          in a new successful run still rewrote its JSON and moved its availability
          provenance. The independent Codex review identified this gap. The final guard
          compares filing values and date; an identical observation retains its original
          completed successful/partial run. Failed, skipped or unfinished provenance is
          replaceable by the retry, and real corrections still acquire the new run.
          Five additional restricted-role scenarios exercise both usable statuses and
          all three recovery statuses, including a later failed retry and real changes.
          
          ### Index changes and deliberate non-changes''')
          s = s.replace('- `app.research_report`: no active application producer/consumer was found in', '- `analysis.symbol_decision`: only its baseline table declaration was found; the\n  active `analysis.symbol_decision_outcome` references canonical `analysis.decision`,\n  not this legacy extension. Retire only after checking live legacy data and\n  archive coverage, not merely because the current source has no writer.\n- `app.research_report`: no active application producer/consumer was found in')
          p.write_text(s)
          PY
          git rm .github/workflows/storage-audit-verification.yml
          git add src/investment_panel/infrastructure/postgres/ingestion.py docs/acceptance/storage-schema-audit-20260927.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve usable fundamental provenance across identical ingestion runs'
          git push origin HEAD:refs/heads/codex/storage-audit-20260927
          mkdir -p "$RUNNER_TEMP/storage-proof"
          git rev-parse HEAD | tee "$RUNNER_TEMP/storage-proof/candidate.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/storage-proof/market-source.tar.gz"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - name: Install locked dependencies
        run: |
          uv sync --extra test --locked
          npm ci --prefix frontend
      - name: Reproduce all cross-run failures on the reviewed candidate
        run: |
          set -euo pipefail
          red="$RUNNER_TEMP/storage-red"
          git worktree add --detach "$red" 9eeccffcac6347b93719a581516a04f46d7411d2
          cp tests/postgres/test_fundamental_cross_run_retry.py "$red/tests/postgres/"
          set +e
          (cd "$red" && uv run --extra test python -m pytest -q tests/postgres/test_fundamental_cross_run_retry.py --junitxml="$RUNNER_TEMP/storage-proof/cross-run-red.xml") 2>&1 | tee "$RUNNER_TEMP/storage-proof/cross-run-red.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'storage-proof/cross-run-red.xml').getroot()
          assert not root.findall('.//error'), 'Setup errors are not regression proof'
          assert len(root.findall('.//failure')) == 5
          PY
          git worktree remove --force "$red"
      - name: Final focused PostgreSQL and lifecycle E2E
        run: |
          set -euo pipefail
          uv run --extra test python -m pytest -q tests/postgres/test_fundamental_cross_run_retry.py tests/postgres/test_storage_efficiency.py tests/postgres/test_storage_checkpoint_retry.py tests/postgres/test_storage_catalog_audit.py tests/postgres/test_fundamental_storage_retry.py tests/postgres/test_hot_storage_lifecycle.py tests/postgres/test_decision_storage.py tests/postgres/test_postgres_ingestion.py tests/postgres/test_postgres_retention_backup.py tests/postgres/test_postgres_panel_catalog.py tests/postgres/test_schema_baseline.py tests/postgres/test_ticker_paper_execution.py tests/postgres/test_outcome_publication_recovery.py tests/postgres/test_storage_archive.py tests/postgres/test_storage_guard.py tests/postgres/test_storage_safety_limits.py tests/postgres/test_price_confirmation_retention.py tests/postgres/test_payload_archive.py tests/application_api/test_api.py tests/application_api/test_storage_health_api.py tests/application_api/test_release_smoke.py --junitxml="$RUNNER_TEMP/storage-proof/focused.xml" 2>&1 | tee "$RUNNER_TEMP/storage-proof/focused.log"
      - name: Guards
        run: set -o pipefail; make guards 2>&1 | tee "$RUNNER_TEMP/storage-proof/guards.log"
      - name: Check
        run: set -o pipefail; make check 2>&1 | tee "$RUNNER_TEMP/storage-proof/check.log"
      - name: Release fixture smoke
        run: set -o pipefail; make release-fixture-smoke 2>&1 | tee "$RUNNER_TEMP/storage-proof/fixture-smoke.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-audit-focused-proof
          path: ${{ runner.temp }}/storage-proof/
          retention-days: 7
      - name: Frozen final release gate
        run: set -o pipefail; make release-gate 2>&1 | tee "$RUNNER_TEMP/storage-proof/release-gate.log"
      - name: Confirm frozen source
        if: always()
        run: |
          git rev-parse HEAD
          git status --short
          git diff --check
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/storage-proof/candidate.txt")"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-audit-verification
          path: ${{ runner.temp }}/storage-proof/
          retention-days: 7
