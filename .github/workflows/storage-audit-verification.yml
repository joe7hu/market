name: storage-audit-verification
on:
  push:
    branches: [codex/storage-audit-20260927]
    paths: [.github/workflows/storage-audit-verification.yml]
permissions:
  contents: write
jobs:
  storage-audit:
    if: github.ref == 'refs/heads/codex/storage-audit-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply bounded health path and freeze source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/investment_panel/infrastructure/postgres/storage_archive.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '25405d203d504131a4f9b509f3e18a49bf7d3c06ae98528d51d1f492af14b0bb'
          s = p.read_text()
          s = s.replace('from investment_panel.infrastructure.postgres.runtime import DatabaseRuntime, JOB_PROFILE', 'from investment_panel.infrastructure.postgres.runtime import API_PROFILE, DatabaseRuntime, JOB_PROFILE')
          old = '    def account(self, *, record: bool = False) -> dict[str, Any]:\n        """Measure the PostgreSQL filesystem and a conservative 30-day trend."""\n        with self.runtime.read(JOB_PROFILE) as connection:'
          new = '    def account(self, *, record: bool = False, include_backlog: bool = True) -> dict[str, Any]:\n        """Measure files/trends; historical row sizing is explicit maintenance work."""\n        profile = JOB_PROFILE if include_backlog else API_PROFILE\n        with self.runtime.read(profile) as connection:'
          assert s.count(old) == 1
          s = s.replace(old, new)
          start = s.index('            backlog = connection.execute("""', s.index('    def account('))
          end = s.index('\n        path = Path(', start)
          body = s[start:end]
          s = s[:start] + '            backlog = None\n            if include_backlog:\n' + '\n'.join('    ' + line for line in body.splitlines()) + s[end:]
          start = s.index('    def account(')
          end = s.index('    def plan(', start)
          section = s[start:end].replace('with self.runtime.read(JOB_PROFILE) as connection:', 'with self.runtime.read(profile) as connection:')
          section = section.replace('"archive_backlog_basis": "old_local_rows_not_eligibility_count",', '"archive_backlog_basis": "old_local_rows_not_eligibility_count" if include_backlog else "not_scanned_on_health_request",')
          section = section.replace('"archive_backlog": {', '"archive_backlog": None if backlog is None else {')
          section = section.replace('"protected_bytes": int(', '"protected_bytes": None if backlog is None else int(')
          section = section.replace('"protected_rows": {', '"protected_rows": None if backlog is None else {')
          section = section.replace('"protected_bytes_status": "old_local_row_lower_bound_excludes_shared_dependencies",', '"protected_bytes_status": "old_local_row_lower_bound_excludes_shared_dependencies" if include_backlog else "not_scanned_on_health_request",')
          s = s[:start] + section + s[end:]
          assert s.count('        accounting = self.account()\n') == 1
          s = s.replace('        accounting = self.account()\n', '        accounting = self.account(include_backlog=False)\n')
          compile(s, str(p), 'exec')
          p.write_text(s)
          p = Path('docs/acceptance/storage-schema-audit-20260927.md')
          s = p.read_text()
          marker = '### Index changes and deliberate non-changes'
          assert s.count(marker) == 1
          s = s.replace(marker, '''### Bounded storage-health reads
          
          The storage-health endpoint previously called full maintenance accounting,
          including row-by-row historical evidence sizing under a 15-minute job
          statement timeout. Health now requests capacity/forecast accounting without
          that scan, with the normal three-second per-statement API budget. Historical
          row counts/sizes are explicitly not measured in that response, never zeroed
          or mislabeled. The explicit accounting command retains detailed measurements.
          A real restricted-role PostgreSQL regression observes executed queries and
          read profiles, preserves capacity decisions, and verifies that detailed
          maintenance accounting remains available. Filesystem/mount latency is not
          bounded by the PostgreSQL statement timeout.
          
          ### Index changes and deliberate non-changes''')
          p.write_text(s)
          PY
          git rm .github/workflows/storage-audit-verification.yml
          git add src/investment_panel/infrastructure/postgres/storage_archive.py docs/acceptance/storage-schema-audit-20260927.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep historical payload-size scans off storage health requests'
          git push origin HEAD:refs/heads/codex/storage-audit-20260927
          mkdir -p "$RUNNER_TEMP/storage-proof"
          git rev-parse HEAD | tee "$RUNNER_TEMP/storage-proof/candidate.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/storage-proof/market-source.tar.gz"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - name: Install locked dependencies
        run: |
          uv sync --extra test --locked
          npm ci --prefix frontend
      - name: Reproduce the health read-budget regression
        run: |
          set -euo pipefail
          red="$RUNNER_TEMP/storage-red"
          git worktree add --detach "$red" 66bea7934b4786f71f554a4a29241e7ae1e16c3b
          cp tests/postgres/test_storage_health_read_budget.py "$red/tests/postgres/"
          set +e
          (cd "$red" && uv run --extra test python -m pytest -q tests/postgres/test_storage_health_read_budget.py --junitxml="$RUNNER_TEMP/storage-proof/health-red.xml") 2>&1 | tee "$RUNNER_TEMP/storage-proof/health-red.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'storage-proof/health-red.xml').getroot()
          assert not root.findall('.//error'), 'Setup errors are not regression proof'
          assert len(root.findall('.//failure')) == 1
          PY
          git worktree remove --force "$red"
      - name: Final affected PostgreSQL, lifecycle, and API E2E
        run: |
          set -euo pipefail
          uv run --extra test python -m pytest -q tests/postgres/test_storage_health_read_budget.py tests/postgres/test_fundamental_cross_run_retry.py tests/postgres/test_storage_efficiency.py tests/postgres/test_storage_checkpoint_retry.py tests/postgres/test_storage_catalog_audit.py tests/postgres/test_fundamental_storage_retry.py tests/postgres/test_hot_storage_lifecycle.py tests/postgres/test_decision_storage.py tests/postgres/test_postgres_ingestion.py tests/postgres/test_postgres_retention_backup.py tests/postgres/test_postgres_panel_catalog.py tests/postgres/test_schema_baseline.py tests/postgres/test_ticker_paper_execution.py tests/postgres/test_outcome_publication_recovery.py tests/postgres/test_storage_archive.py tests/postgres/test_storage_guard.py tests/postgres/test_storage_safety_limits.py tests/postgres/test_price_confirmation_retention.py tests/postgres/test_payload_archive.py tests/application_api/test_api.py tests/application_api/test_storage_health_api.py tests/application_api/test_release_smoke.py --junitxml="$RUNNER_TEMP/storage-proof/focused.xml" 2>&1 | tee "$RUNNER_TEMP/storage-proof/focused.log"
      - name: Guards
        run: set -o pipefail; make guards 2>&1 | tee "$RUNNER_TEMP/storage-proof/guards.log"
      - name: Check
        run: set -o pipefail; make check 2>&1 | tee "$RUNNER_TEMP/storage-proof/check.log"
      - name: Release fixture smoke
        run: set -o pipefail; make release-fixture-smoke 2>&1 | tee "$RUNNER_TEMP/storage-proof/fixture-smoke.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-audit-focused-proof
          path: ${{ runner.temp }}/storage-proof/
          retention-days: 7
      - name: Frozen final release gate
        run: set -o pipefail; make release-gate 2>&1 | tee "$RUNNER_TEMP/storage-proof/release-gate.log"
      - name: Confirm frozen source
        if: always()
        run: |
          git rev-parse HEAD
          git status --short
          git diff --check
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/storage-proof/candidate.txt")"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-audit-verification
          path: ${{ runner.temp }}/storage-proof/
          retention-days: 7
