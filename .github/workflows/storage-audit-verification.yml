name: storage-audit-verification
on:
  push:
    branches: [codex/storage-audit-20260927]
    paths: [.github/workflows/storage-audit-verification.yml]
permissions:
  contents: write
jobs:
  storage-audit:
    if: github.ref == 'refs/heads/codex/storage-audit-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed option correction and freeze source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/investment_panel/infrastructure/postgres/ingestion.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'c71aa933327b162bff109ffa9814aab247ed1734da8ca5612d09a1c0db71e401'
          s = p.read_text()
          changes = [
            ('                    raw.option_snapshot.ingest_run_id, raw.option_snapshot.payload_id,',
             '                    raw.option_snapshot.payload_id,'),
            ('                    EXCLUDED.ingest_run_id, COALESCE(EXCLUDED.payload_id,',
             '                    COALESCE(EXCLUDED.payload_id,'),
            ('                    EXCLUDED.capture_state)\n                RETURNING id',
             "                    EXCLUDED.capture_state)\n                   OR (raw.option_snapshot.ingest_run_id IS DISTINCT FROM EXCLUDED.ingest_run_id\n                       AND NOT EXISTS (\n                         SELECT 1 FROM ingest.run previous_run\n                         WHERE previous_run.id = raw.option_snapshot.ingest_run_id\n                           AND previous_run.status IN ('succeeded', 'partial')\n                           AND previous_run.finished_at IS NOT NULL\n                       ))\n                RETURNING id"),
            ('                connection.execute(\n                    """\n                    WITH staged AS (',
             '                quote_result = connection.execute(\n                    """\n                    WITH staged AS ('),
          ]
          for old, new in changes:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          old = '                     snapshot_id, capture_generation_id, observed_at, observed_at],\n                )\n            connection.execute('
          new = '\n'.join([
            '                     snapshot_id, capture_generation_id, observed_at, observed_at],',
            '                )',
            '                if quote_result.rowcount:',
            '                    # Changed or newly inserted quote facts must acquire the',
            "                    # incoming run's availability, even with identical header",
            '                    # metadata. An unchanged retry keeps its usable old run.',
            '                    connection.execute(',
            '                        """UPDATE raw.option_snapshot SET ingest_run_id = %s',
            '                           WHERE id = %s AND ingest_run_id IS DISTINCT FROM %s""",',
            '                        [run_id, snapshot_id, run_id],',
            '                    )',
            '            connection.execute(',
          ])
          assert s.count(old) == 1
          s = s.replace(old, new)
          compile(s, str(p), 'exec')
          p.write_text(s)
          p = Path('docs/acceptance/storage-schema-audit-20260927.md')
          s = p.read_text()
          marker = '### Bounded storage-health reads'
          assert s.count(marker) == 1
          s = s.replace(marker, '''### Independent-review correction: option snapshot provenance
          
          An identical option replay could likewise attach a previously valid snapshot
          to a new running run; a later failure hid it from the current option panel.
          Identical headers and quote facts now retain usable completed provenance.
          Failed, skipped or unfinished provenance is repaired by the incoming run.
          Crucially, a changed or newly inserted quote still attaches the snapshot to
          the incoming run even when its header is unchanged: changed facts must not
          be presented with the old successful run's earlier availability timestamp.
          Nine additional PostgreSQL scenarios exercise the actual current-option
          panel query, usable/recovery statuses, failed replays, quote corrections,
          provider-payload revisions, new observations and snapshot metadata changes.
          
          ### Bounded storage-health reads''')
          p.write_text(s)
          PY
          git rm .github/workflows/storage-audit-verification.yml
          git add src/investment_panel/infrastructure/postgres/ingestion.py docs/acceptance/storage-schema-audit-20260927.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain valid option captures on retries without backdating changed quotes'
          git push origin HEAD:refs/heads/codex/storage-audit-20260927
          mkdir -p "$RUNNER_TEMP/storage-proof"
          git rev-parse HEAD | tee "$RUNNER_TEMP/storage-proof/candidate.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/storage-proof/market-source.tar.gz"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - name: Install locked dependencies
        run: |
          uv sync --extra test --locked
          npm ci --prefix frontend
      - name: Reproduce option replay failures on the reviewed source
        run: |
          set -euo pipefail
          red="$RUNNER_TEMP/storage-red"
          git worktree add --detach "$red" 66bea7934b4786f71f554a4a29241e7ae1e16c3b
          cp tests/postgres/test_option_snapshot_cross_run_retry.py "$red/tests/postgres/"
          set +e
          (cd "$red" && uv run --extra test python -m pytest -q tests/postgres/test_option_snapshot_cross_run_retry.py --junitxml="$RUNNER_TEMP/storage-proof/option-red.xml") 2>&1 | tee "$RUNNER_TEMP/storage-proof/option-red.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'storage-proof/option-red.xml').getroot()
          assert not root.findall('.//error'), 'Setup errors are not regression proof'
          assert len(root.findall('.//failure')) == 9
          PY
          git worktree remove --force "$red"
      - name: Final affected PostgreSQL, lifecycle, and API E2E
        run: |
          set -euo pipefail
          uv run --extra test python -m pytest -q tests/postgres/test_option_snapshot_cross_run_retry.py tests/postgres/test_storage_health_read_budget.py tests/postgres/test_fundamental_cross_run_retry.py tests/postgres/test_storage_efficiency.py tests/postgres/test_storage_checkpoint_retry.py tests/postgres/test_storage_catalog_audit.py tests/postgres/test_fundamental_storage_retry.py tests/postgres/test_hot_storage_lifecycle.py tests/postgres/test_decision_storage.py tests/postgres/test_postgres_ingestion.py tests/postgres/test_postgres_retention_backup.py tests/postgres/test_postgres_panel_catalog.py tests/postgres/test_schema_baseline.py tests/postgres/test_ticker_paper_execution.py tests/postgres/test_outcome_publication_recovery.py tests/postgres/test_storage_archive.py tests/postgres/test_storage_guard.py tests/postgres/test_storage_safety_limits.py tests/postgres/test_price_confirmation_retention.py tests/postgres/test_payload_archive.py tests/application_api/test_api.py tests/application_api/test_storage_health_api.py tests/application_api/test_release_smoke.py --junitxml="$RUNNER_TEMP/storage-proof/focused.xml" 2>&1 | tee "$RUNNER_TEMP/storage-proof/focused.log"
      - name: Guards
        run: set -o pipefail; make guards 2>&1 | tee "$RUNNER_TEMP/storage-proof/guards.log"
      - name: Check
        run: set -o pipefail; make check 2>&1 | tee "$RUNNER_TEMP/storage-proof/check.log"
      - name: Release fixture smoke
        run: set -o pipefail; make release-fixture-smoke 2>&1 | tee "$RUNNER_TEMP/storage-proof/fixture-smoke.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-audit-focused-proof
          path: ${{ runner.temp }}/storage-proof/
          retention-days: 7
      - name: Frozen final release gate
        run: set -o pipefail; make release-gate 2>&1 | tee "$RUNNER_TEMP/storage-proof/release-gate.log"
      - name: Confirm frozen source
        if: always()
        run: |
          git rev-parse HEAD
          git status --short
          git diff --check
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/storage-proof/candidate.txt")"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-audit-verification
          path: ${{ runner.temp }}/storage-proof/
          retention-days: 7
