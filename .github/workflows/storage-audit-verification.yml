name: storage-audit-verification
on:
  push:
    branches: [codex/storage-audit-20260927]
    paths: [.github/workflows/storage-audit-verification.yml]
permissions:
  contents: write
  statuses: write
jobs:
  storage-audit:
    if: github.ref == 'refs/heads/codex/storage-audit-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTEST_ADDOPTS: --postgresql-exec=/usr/lib/postgresql/18/bin/pg_ctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Correct the active-source fixture and freeze source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tests/postgres/test_option_snapshot_cross_run_retry.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '44da6be1471f1ccbe510625bf07cf8558d98940e32eb6214ba167783292f2c81'
          s = p.read_text()
          old = 'family="broker", kind="option_chain")'
          assert s.count(old) == 1
          s = s.replace(old, 'family="broker", kind="option_chain", origin="test")')
          compile(s, str(p), 'exec')
          p.write_text(s)
          PY
          git rm .github/workflows/storage-audit-verification.yml
          git add tests/postgres/test_option_snapshot_cross_run_retry.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: exercise replay visibility through an explicitly active option source'
          git push origin HEAD:refs/heads/codex/storage-audit-20260927
          mkdir -p "$RUNNER_TEMP/storage-proof"
          git rev-parse HEAD | tee "$RUNNER_TEMP/storage-proof/candidate.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/storage-proof/market-source.tar.gz"
      - name: Publish pending acceptance on the actual frozen head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(cat "$RUNNER_TEMP/storage-proof/candidate.txt")"
          printf '{"state":"pending","context":"storage-audit/release-gate","description":"Verifying the exact frozen source, including PostgreSQL and review regressions","target_url":"https://github.com/%s/actions/runs/%s"}' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/status.json"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$sha" --data-binary @"$RUNNER_TEMP/status.json" > /dev/null
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.26'
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        with:
          postgres-version: '18'
      - name: Install locked dependencies
        run: |
          uv sync --extra test --locked
          npm ci --prefix frontend
      - name: Reproduce real replay failures with a valid active source
        run: |
          set -euo pipefail
          red="$RUNNER_TEMP/storage-red"
          git worktree add --detach "$red" 66bea7934b4786f71f554a4a29241e7ae1e16c3b
          cp tests/postgres/test_option_snapshot_cross_run_retry.py "$red/tests/postgres/"
          set +e
          (cd "$red" && uv run --extra test python -m pytest -q tests/postgres/test_option_snapshot_cross_run_retry.py --junitxml="$RUNNER_TEMP/storage-proof/option-red.xml") 2>&1 | tee "$RUNNER_TEMP/storage-proof/option-red.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'storage-proof/option-red.xml').getroot()
          assert not root.findall('.//error'), 'Setup errors are not regression proof'
          failures = root.findall('.//failure')
          assert len(failures) == 9
          for failure in failures:
              assert re.search(r'>\s+assert _state\(runtime\) == (before|after)', failure.text or ''), 'Failure must be replay behavior, not an invalid fixture precondition'
          PY
          git worktree remove --force "$red"
      - name: Final affected PostgreSQL, lifecycle, and API E2E
        run: |
          set -euo pipefail
          uv run --extra test python -m pytest -q tests/postgres/test_option_snapshot_cross_run_retry.py tests/postgres/test_storage_health_read_budget.py tests/postgres/test_fundamental_cross_run_retry.py tests/postgres/test_storage_efficiency.py tests/postgres/test_storage_checkpoint_retry.py tests/postgres/test_storage_catalog_audit.py tests/postgres/test_fundamental_storage_retry.py tests/postgres/test_hot_storage_lifecycle.py tests/postgres/test_decision_storage.py tests/postgres/test_postgres_ingestion.py tests/postgres/test_postgres_retention_backup.py tests/postgres/test_postgres_panel_catalog.py tests/postgres/test_schema_baseline.py tests/postgres/test_ticker_paper_execution.py tests/postgres/test_outcome_publication_recovery.py tests/postgres/test_storage_archive.py tests/postgres/test_storage_guard.py tests/postgres/test_storage_safety_limits.py tests/postgres/test_price_confirmation_retention.py tests/postgres/test_payload_archive.py tests/application_api/test_api.py tests/application_api/test_storage_health_api.py tests/application_api/test_release_smoke.py --junitxml="$RUNNER_TEMP/storage-proof/focused.xml" 2>&1 | tee "$RUNNER_TEMP/storage-proof/focused.log"
      - name: Guards
        run: set -o pipefail; make guards 2>&1 | tee "$RUNNER_TEMP/storage-proof/guards.log"
      - name: Check
        run: set -o pipefail; make check 2>&1 | tee "$RUNNER_TEMP/storage-proof/check.log"
      - name: Release fixture smoke
        run: set -o pipefail; make release-fixture-smoke 2>&1 | tee "$RUNNER_TEMP/storage-proof/fixture-smoke.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-audit-focused-proof
          path: ${{ runner.temp }}/storage-proof/
          retention-days: 7
      - name: Frozen final release gate
        run: set -o pipefail; make release-gate 2>&1 | tee "$RUNNER_TEMP/storage-proof/release-gate.log"
      - name: Confirm frozen source
        if: always()
        run: |
          git rev-parse HEAD
          git status --short
          git diff --check
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/storage-proof/candidate.txt")"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-audit-verification
          path: ${{ runner.temp }}/storage-proof/
          retention-days: 7
      - name: Publish exact-head acceptance result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/storage-proof/candidate.txt"
          sha="$(cat "$RUNNER_TEMP/storage-proof/candidate.txt")"
          state=failure
          if test "$ACCEPTANCE_RESULT" = success; then state=success; fi
          printf '{"state":"%s","context":"storage-audit/release-gate","description":"Frozen-source PostgreSQL, guards, check, fixture smoke and complete release gate","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/status.json"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$sha" --data-binary @"$RUNNER_TEMP/status.json" > /dev/null
