name: storage-review-source

on:
  pull_request:
    paths:
      - .github/workflows/storage-review-source.yml

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Package tracked source only
        run: git archive --format=tar HEAD | gzip > /tmp/market-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-review-source
          path: /tmp/market-source.tar.gz
          retention-days: 1
