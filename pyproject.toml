[project]
name = "investment-panel"
version = "0.1.0"
description = "Local investment signal and research panel."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "ibapi>=9.81.1",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "pydantic>=2.9.0",
  "pypdf>=6.11.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "pyyaml>=6.0.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.30.0",
  "yfinance>=0.2.60",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-postgresql>=7.0.0",
]

[project.scripts]
market-db-migrate = "investment_panel.database.migrations:main"
market-snapshot-database = "investment_panel.jobs.snapshot_database:main"
market-storage = "investment_panel.jobs.storage:main"
market-update-robinhood-options = "investment_panel.jobs.update_robinhood_options:main"
market-robinhood-option-history = "investment_panel.jobs.robinhood_option_history:main"
market-detect-option-events = "investment_panel.jobs.detect_option_events:main"
market-replay-option-history = "investment_panel.jobs.replay_option_history:main"
market-update-broker-sources = "investment_panel.jobs.update_broker_sources:main"
market-update-market-data = "investment_panel.jobs.update_market_data:main"
market-update-content-sources = "investment_panel.jobs.update_content_sources:main"
market-update-event-calendar = "investment_panel.jobs.update_market_events:main"
market-update-disclosures = "investment_panel.jobs.update_disclosure_sources:main"
market-update-arco-data = "investment_panel.jobs.update_arco_sources:main"
market-refresh-options-radar = "investment_panel.jobs.refresh_options_radar:main"
market-publish-ticker-decisions = "investment_panel.jobs.ticker_decisions:main"
market-hourly-options-radar = "investment_panel.jobs.hourly_options_radar:main"
market-premarket-options-intelligence = "investment_panel.jobs.premarket_options_intelligence:main"
market-run-option-recovery-agents = "investment_panel.jobs.run_option_recovery_agents:main"
market-run-option-agent = "investment_panel.jobs.run_option_agent:main"
market-run-thesis-monitor = "investment_panel.jobs.run_thesis_monitor:main"
market-full-refresh = "investment_panel.jobs.full_market_refresh:main"
market-refresh-decision-models = "investment_panel.jobs.postgres_refresh:main_publish"
market-update-preopen-daily-brief = "investment_panel.jobs.postgres_refresh:main_preopen"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_panel", "app"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "investment_panel/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
postgresql_exec = "/opt/homebrew/opt/postgresql@18/bin/pg_ctl"

[tool.ruff]
# Module length is inventory information, not a hard architecture failure.
# Line length (E501) remains intentionally outside this focused Ruff gate.
target-version = "py311"
extend-exclude = [".venv", "frontend", "build", "dist"]

[tool.ruff.lint]
# High-signal, zero-false-positive rules that are GREEN today, so `make check`
# stays a real gate rather than a wall of pre-existing noise. F401 and F811
# are enabled after compatibility facades were removed and package exports
# were made explicit. B remains outside this focused gate until its findings
# receive a separate cleanup.
select = [
  "E9",                              # syntax / IO / runtime errors
  "F401",                            # unused imports
  "F811",                            # redefined names
  "F63", "F7",                       # logic errors (assert tuple, break outside loop, ...)
  "F501", "F502", "F503", "F506", "F509",  # %-format string bugs
  "F601", "F602",                    # `is` / `is not` against a literal
  "E711", "E712", "E713", "E714",    # `== None`, `== True`, `not in`, `not ... is`
  "E722",                            # bare `except:`
  "PLE",                             # pylint error-class rules
]
